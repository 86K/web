<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" fill="none">
  <!-- Background -->
  <rect width="800" height="600" fill="#f0f4f8"></rect>

  <!-- Title -->
  <text x="50%" y="60" text-anchor="middle" font-size="36" font-family="Verdana, sans-serif" fill="#1f2937">
    Technology Tutorial
  </text>

  <!-- Desk -->
  <rect x="0" y="450" width="800" height="150" fill="#d1d5db"></rect>

  <!-- Laptop -->
  <rect x="300" y="250" width="200" height="140" rx="10" fill="#374151" stroke="#111827" stroke-width="2"></rect>
  <rect x="320" y="270" width="160" height="100" rx="5" fill="#111827"></rect>
  <!-- Code Lines -->
  <line x1="330" y1="290" x2="460" y2="290" stroke="#10b981" stroke-width="4"></line>
  <line x1="330" y1="310" x2="450" y2="310" stroke="#f59e0b" stroke-width="3"></line>
  <line x1="330" y1="330" x2="440" y2="330" stroke="#3b82f6" stroke-width="3"></line>

  <!-- Book -->
  <rect x="530" y="300" width="80" height="60" rx="5" fill="#e5e7eb" stroke="#9ca3af" stroke-width="2"></rect>
  <line x1="540" y1="310" x2="590" y2="310" stroke="#9ca3af"></line>
  <line x1="540" y1="325" x2="590" y2="325" stroke="#9ca3af"></line>
  <line x1="540" y1="340" x2="590" y2="340" stroke="#9ca3af"></line>

  <!-- Coffee Mug -->
  <rect x="190" y="340" width="40" height="40" rx="8" fill="#fcd34d"></rect>
  <path d="M230 350 q10 0 10 10 q0 10 -10 10" fill="none" stroke="#92400e" stroke-width="4"></path>

  <!-- Mouse Cursor -->
  <polygon points="100,200 125,260 135,245 155,280 165,275 145,240 165,230" fill="#1f2937"></polygon>

  <!-- Chat Bubble -->
  <rect x="180" y="180" width="120" height="60" rx="10" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2"></rect>
  <text x="190" y="210" font-size="16" font-family="Arial" fill="#0c4a6e">Learn to Code!</text>

  <!-- Cloud + Gears -->
  <ellipse cx="650" cy="150" rx="80" ry="40" fill="#e5e7eb"></ellipse>
  <circle cx="620" cy="140" r="10" fill="#6b7280"></circle>
  <path d="M620 125 v-10 M620 155 v10 M635 140 h10 M605 140 h-10" stroke="#f5f5f5" stroke-width="2"></path>
  <circle cx="670" cy="160" r="10" fill="#9ca3af"></circle>
  <path d="M670 145 v-10 M670 175 v10 M685 160 h10 M655 160 h-10" stroke="#f5f5f5" stroke-width="2"></path>

  <!-- Code Symbol -->
  <text x="370" y="420" font-size="32" font-family="Courier New" fill="#4b5563">&lt;/&gt;</text>

  <!-- Lightbulb -->
  <circle cx="100" cy="100" r="30" fill="#fde68a" stroke="#f59e0b" stroke-width="3"></circle>
  <rect x="90" y="125" width="20" height="10" rx="2" fill="#92400e"></rect>
  <line x1="100" y1="70" x2="100" y2="50" stroke="#fbbf24" stroke-width="4"></line>
  <line x1="75" y1="80" x2="60" y2="70" stroke="#fbbf24" stroke-width="4"></line>
  <line x1="125" y1="80" x2="140" y2="70" stroke="#fbbf24" stroke-width="4"></line>

</svg>
