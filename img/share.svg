<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" fill="none">
  <!-- Background -->
  <rect width="800" height="600" fill="#f0f4f8"></rect>

  <!-- Title -->
  <text x="50%" y="60" text-anchor="middle" font-size="36" font-family="Verdana, sans-serif" fill="#1f2937">
    Technology Share
  </text>

  <!-- Laptop -->
  <rect x="300" y="300" width="200" height="130" rx="10" fill="#374151" stroke="#111827" stroke-width="2"></rect>
  <rect x="320" y="320" width="160" height="90" rx="5" fill="#111827"></rect>
  <!-- Sharing Icon Inside -->
  <circle cx="400" cy="365" r="20" fill="#3b82f6"></circle>
  <circle cx="370" cy="345" r="8" fill="#f0f9ff"></circle>
  <circle cx="430" cy="345" r="8" fill="#f0f9ff"></circle>
  <line x1="370" y1="345" x2="400" y2="365" stroke="#f0f9ff" stroke-width="2"></line>
  <line x1="430" y1="345" x2="400" y2="365" stroke="#f0f9ff" stroke-width="2"></line>

  <!-- Person A (Top Left) -->
  <circle cx="160" cy="180" r="30" fill="#facc15"></circle>
  <circle cx="160" cy="170" r="10" fill="#fefce8"></circle>
  <text x="145" y="210" font-size="14" font-family="Arial" fill="#78350f">Alice</text>

  <!-- Person B (Top Right) -->
  <circle cx="640" cy="180" r="30" fill="#34d399"></circle>
  <circle cx="640" cy="170" r="10" fill="#ecfdf5"></circle>
  <text x="625" y="210" font-size="14" font-family="Arial" fill="#065f46">Bob</text>

  <!-- Arrows Connecting to Laptop -->
  <line x1="640" y1="220" x2="500" y2="300" stroke="#60a5fa" stroke-width="4" marker-end="url(#arrowhead)"></line>
  <line x1="160" y1="220" x2="300" y2="300" stroke="#60a5fa" stroke-width="4" marker-end="url(#arrowhead)"></line>

  <!-- People Receiving (Bottom Left/Right) -->
  <circle cx="120" cy="480" r="25" fill="#f87171"></circle>
  <circle cx="680" cy="480" r="25" fill="#60a5fa"></circle>
  <text x="108" y="488" font-size="20" fill="#1f2937" font-family="Arial">C</text>
  <text x="668" y="488" font-size="20" fill="#1f2937" font-family="Arial">D</text>

  <!-- Arrows from Laptop to People -->
  <line x1="350" y1="430" x2="145" y2="460" stroke="#9ca3af" stroke-width="3" marker-end="url(#arrowhead)"></line>
  <line x1="450" y1="430" x2="655" y2="460" stroke="#9ca3af" stroke-width="3" marker-end="url(#arrowhead)"></line>

  <!-- File Icon -->
  <rect x="380" y="150" width="40" height="50" rx="4" fill="#ffffff" stroke="#9ca3af" stroke-width="2"></rect>
  <polyline points="380,150 420,150 420,190" fill="none" stroke="#9ca3af" stroke-width="2"></polyline>
  <text x="388" y="180" font-size="14" fill="#6b7280">.zip</text>

  <!-- Arrow from file to laptop -->
  <line x1="400" y1="200" x2="400" y2="300" stroke="#6b7280" stroke-width="3" marker-end="url(#arrowhead)"></line>

  <!-- Server Icon -->
  <rect x="600" y="350" width="80" height="100" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"></rect>
  <circle cx="640" cy="370" r="6" fill="#10b981"></circle>
  <line x1="610" y1="390" x2="670" y2="390" stroke="#9ca3af" stroke-width="2"></line>
  <line x1="610" y1="410" x2="670" y2="410" stroke="#9ca3af" stroke-width="2"></line>
  <text x="610" y="440" font-size="12" fill="#4b5563">Server</text>

  <!-- Arrow from server to laptop -->
  <line x1="640" y1="350" x2="450" y2="300" stroke="#60a5fa" stroke-width="3" marker-end="url(#arrowhead)"></line>

  <!-- Marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <polygon points="0 0, 10 3.5, 0 7" fill="#374151"></polygon>
    </marker>
  </defs>
</svg>
